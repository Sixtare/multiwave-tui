[package]
name = "multiwave-tui"
version = "0.1.0"
edition = "2024"
license = "MIT"

[dependencies]
color-eyre = "0.6.5"
crossterm = "0.29.0"
ratatui = "0.30.2"
cpal = "0.17"  # Ou a versão mais recente
realfft = "3.3" # Para fazer a conversão rápida de tempo -> frequência

[target.'cfg(windows)'.dependencies]
wasapi = "0.26"
sysinfo = { version = "0.39", default-features = false, features = ["system"] }
